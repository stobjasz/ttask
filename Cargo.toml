[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ttask-core = { path = "crates/ttask-core" }
ttask-store = { path = "crates/ttask-store" }
ttask-app = { path = "crates/ttask-app" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
rpassword = "7.5.4"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
ulid = "3.0.0"

# dev
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
