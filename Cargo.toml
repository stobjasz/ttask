[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stobjasz/ttask"

[workspace.dependencies]
ttask-core = { path = "crates/ttask-core" }
ttask-store = { path = "crates/ttask-store" }
ttask-app = { path = "crates/ttask-app" }
ttask-tui = { path = "crates/ttask-tui" }

age = "0.12.1"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
csv = "1.4.0"
jiff = { version = "0.2.38", features = ["serde"] }
keyring = "4.2.0"
notify-rust = "4.18.2"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
directories = "6.0.0"
rpassword = "7.5.4"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"
unicode-width = "0.2.2"
ulid = "3.0.0"

# dev
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

# Full debug info for every dependency is most of target/'s size. Line tables
# keep file:line in backtraces for our crates; deps get none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = true
codegen-units = 1
strip = true
