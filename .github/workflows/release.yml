name: Release

# Push a tag `vX.Y.Z` matching the workspace version to build the Windows exe,
# publish a GitHub release, and update the Scoop and WinGet manifests.
# Run it by hand (Actions > Release > Run workflow) to build without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Also caches ~/.cargo/bin, so cargo-about is only compiled once.
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).packages |
              Where-Object name -eq 'ttask' | Select-Object -ExpandProperty version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
              throw "Tag $env:GITHUB_REF_NAME does not match the workspace version $version"
          }
      - name: Build the portable exe
        shell: pwsh
        run: ./scripts/build-release.ps1
      - name: List third-party licenses
        shell: pwsh
        run: |
          cargo install cargo-about --locked --features cli --version 0.9.2
          cargo about generate about.hbs -o dist/THIRD-PARTY-LICENSES.txt
      - name: Smoke test
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/ttask-*.exe | Select-Object -First 1
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "ttask --version failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Verify a download with: gh attestation verify <exe> --repo <owner>/ttask
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.exe
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "ttask ${GITHUB_REF_NAME#v}" --generate-notes

  scoop:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Write bucket/ttask.json
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $exe = "ttask-$version-x86_64-pc-windows-msvc.exe"
          $hash = (Get-Content "dist/$exe.sha256").Split(' ')[0]
          $manifest = [ordered]@{
              version      = $version
              description  = 'Keyboard-driven personal task tracker for the terminal'
              homepage     = "https://github.com/$env:GITHUB_REPOSITORY"
              license      = 'MIT|Apache-2.0'
              architecture = @{
                  '64bit' = [ordered]@{
                      url  = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$version/$exe#/ttask.exe"
                      hash = $hash
                  }
              }
              bin          = 'ttask.exe'
          }
          New-Item -ItemType Directory -Force bucket | Out-Null
          $manifest | ConvertTo-Json -Depth 5 | Set-Content bucket/ttask.json
      - name: Commit the manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bucket/ttask.json
          git diff --cached --quiet || git commit -m "Scoop: ttask ${GITHUB_REF_NAME#v}"
          git push origin HEAD:main

  winget:
    needs: release
    runs-on: ubuntu-latest
    # Needs a classic PAT (public_repo, workflow) in the WINGET_TOKEN secret, a
    # fork of microsoft/winget-pkgs, and a first version submitted by hand; see
    # docs/RELEASING.md. Skipped until the secret exists.
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: stobjasz.ttask
          installers-regex: '-x86_64-pc-windows-msvc\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
